<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drone Flight Log – Randy Neal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 14px; color: black; }
h1,h2 { text-align: center; margin: 6px 0; }
.card { background: white; border: 2px solid black; border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 3px 8px rgba(0,0,0,.15); }
label { font-weight: bold; margin-top: 10px; display: block; }
input, select, textarea { width: 100%; padding: 10px; margin-top: 4px; font-size: 16px; color: black; border: 1px solid black; border-radius: 6px; }
textarea { resize: vertical; }
input:disabled { background: #f0f0f0; color: black; }
button { width: 100%; padding: 14px; font-size: 18px; margin-top: 10px; border-radius: 10px; border: none; color: white; cursor: pointer; }
.start { background: #28a745; }
.stop { background: #c82333; }
#timer { text-align: center; font-size: 26px; font-weight: bold; margin-top: 10px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 18px; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; word-break: break-word; }
th, td { border: 1px solid black; padding: 8px; text-align: left; vertical-align: top; overflow-wrap: break-word; white-space: normal; }
td.weather { width: 20%; }
td.notes { width: 25%; }
th { background: #f0f0f0; }
.hidden { display: none; }

/* Mobile-friendly layout */
@media (max-width: 700px) {
  .card { padding: 12px; }
  input, select, textarea { font-size: 14px; padding: 8px; }
  button { font-size: 16px; padding: 12px; }
  table, thead, tbody, th, td, tr { display: block; }
  thead { display: none; }
  tr { margin-bottom: 12px; border: 1px solid black; padding: 8px; border-radius: 8px; }
  td { border: none; position: relative; padding-left: 50%; margin-bottom: 6px; }
  td:before { position: absolute; top: 8px; left: 10px; width: 45%; font-weight: bold; white-space: nowrap; }
  td:nth-of-type(1):before { content: "Date"; }
  td:nth-of-type(2):before { content: "Start"; }
  td:nth-of-type(3):before { content: "End"; }
  td:nth-of-type(4):before { content: "Drone"; }
  td:nth-of-type(5):before { content: "Location"; }
  td:nth-of-type(6):before { content: "LAANC"; }
  td:nth-of-type(7):before { content: "Minutes"; }
  td:nth-of-type(8):before { content: "Weather"; }
  td:nth-of-type(9):before { content: "Notes"; }
  td:nth-of-type(10):before { content: "Delete"; }
}
</style>
</head>
<body>

<h1>Drone Flight Log</h1>

<div class="card">
  <label>Pilot</label>
  <input value="Randy Neal" disabled>

  <label>Drone</label>
  <input id="drone">

  <label>Location</label>
  <input id="location">

  <label>LAANC Authorization #</label>
  <input id="laanc" placeholder="e.g. A2025-004821">

  <label>Purpose of Flight</label>
  <input id="purpose">

  <label>Day / Night</label>
  <select id="daynight">
    <option>Day</option>
    <option>Night</option>
  </select>

  <label>Visual Observer</label>
  <input id="observer">

  <label>Weather</label>
  <input id="weather" placeholder="e.g. Clear, Windy" style="color:black;">

  <label>Notes</label>
  <textarea id="notes"></textarea>

  <button class="start" onclick="startFlight()">START FLIGHT</button>
  <button class="stop" onclick="endFlight()">END FLIGHT</button>

  <div id="timer">00:00:00</div>
</div>

<div class="card">
  <h2>Stats</h2>
  <div class="stats">
    <div>Total Flights: <b id="totalFlights">0</b></div>
    <div>Total Minutes: <b id="totalMinutes">0</b></div>
  </div>
</div>

<div class="card">
  <h2>Flight History</h2>
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Start</th>
        <th>End</th>
        <th>Drone</th>
        <th>Location</th>
        <th>LAANC</th>
        <th>Minutes</th>
        <th>Weather</th>
        <th>Notes</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody id="log"></tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, deleteDoc, doc,
  onSnapshot, enableIndexedDbPersistence, Timestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* Firebase config */
const firebaseConfig = {
  apiKey: "AIzaSyBT_rjRmkYzgq0PZo5fTPbIjnICD5kbbzE",
  authDomain: "flight-log-5f750.firebaseapp.com",
  projectId: "flight-log-5f750"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
enableIndexedDbPersistence(db).catch(() => {});

let startTime = null, timerInterval = null;

const formatTime = t => {
  if (!t) return "";
  let dateObj = (typeof t === "object" && t.seconds) ? new Date(t.seconds*1000) : new Date(t);
  return dateObj.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
};

window.startFlight = () => {
  if (startTime) return; // Prevent multiple timers
  startTime = new Date();
  timerInterval = setInterval(() => {
    timer.innerText = new Date(new Date()-startTime).toISOString().substring(11,19);
  },1000);
};

window.endFlight = async () => {
  if (!startTime) return;
  clearInterval(timerInterval);
  timerInterval = null;

  const endTime = new Date();
  const minutes = Math.round((endTime-startTime)/60000);

  const flightData = {
    pilot: "Randy Neal",
    date: Timestamp.fromDate(startTime),
    startTime: Timestamp.fromDate(startTime),
    endTime: Timestamp.fromDate(endTime),
    drone: document.getElementById("drone")?.value || "",
    location: document.getElementById("location")?.value || "",
    laanc: document.getElementById("laanc")?.value || "",
    purpose: document.getElementById("purpose")?.value || "",
    daynight: document.getElementById("daynight")?.value || "Day",
    observer: document.getElementById("observer")?.value || "",
    weather: document.getElementById("weather")?.value || "",
    notes: document.getElementById("notes")?.value || "",
    minutes
  };

  try {
    await addDoc(collection(db,"flights"), flightData);
  } catch(err) {
    console.error("Error saving flight:", err);
    alert("Error saving flight: " + err.message);
    return;
  }

  // Reset form for next flight
  ["drone","location","laanc","purpose","daynight","observer","weather","notes"].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.value = (id==="daynight") ? "Day" : "";
  });
  startTime = null;
  timer.innerText = "00:00:00";
};

window.deleteFlight = async id => {
  if(confirm("Delete this flight?")) {
    await deleteDoc(doc(db,"flights",id));
  }
};

const renderFlights = snap => {
  try {
    log.innerHTML="";
    let flights=0, minutes=0;
    snap.forEach(d=>{
      const f=d.data(); flights++; minutes+=f.minutes;
      const date = f.date?.toDate ? f.date.toDate() : new Date(f.date);
      log.innerHTML+=`
        <tr>
          <td>${date.toLocaleDateString()}</td>
          <td>${formatTime(f.startTime)}</td>
          <td>${formatTime(f.endTime)}</td>
          <td>${f.drone}</td>
          <td>${f.location}</td>
          <td>${f.laanc||""}</td>
          <td>${f.minutes}</td>
          <td class="weather">${f.weather||""}</td>
          <td class="notes">${f.notes||""}</td>
          <td><button onclick="deleteFlight('${d.id}')">❌</button></td>
        </tr>`;
    });
    totalFlights.innerText=flights;
    totalMinutes.innerText=minutes;
  } catch(e){
    console.error("Error rendering flights:", e);
  }
};

onSnapshot(collection(db,"flights"), renderFlights);
</script>

</body>
</html>
