<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drone Flight Log – Randy Neal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  margin: 0;
  padding: 14px;
  color: black;
}

h1, h2 { text-align: center; margin: 6px 0; }

.card {
  background: white;
  border: 2px solid black;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 3px 8px rgba(0,0,0,.15);
}

label {
  font-weight: bold;
  margin-top: 10px;
  display: block;
}

input, select, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 4px;
  font-size: 16px;
  color: black;
  border: 1px solid black;
  border-radius: 6px;
}

input:disabled { background: #f0f0f0; color: black; }
textarea { resize: vertical; }

/* ✅ Weather Section: Flexbox for perfect alignment */
.weather-container {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 6px;
}

.weather-option {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 16px;
  cursor: pointer;
  flex: 1 1 30%; /* allows two or three per row based on screen */
}

/* Buttons */
button {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  color: white;
  cursor: pointer;
}

.start { background: #28a745; }
.stop { background: #c82333; }
.admin { background: #6c757d; }

#timer { text-align: center; font-size: 26px; font-weight: bold; margin-top: 10px; }

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  font-size: 18px;
}

/* Table styling */
table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  word-break: break-word;
}

th, td {
  border: 1px solid black;
  padding: 8px;
  text-align: left;
  vertical-align: top;
  overflow-wrap: break-word;
  white-space: normal;
}

td.weather { width: 20%; }
td.notes { width: 25%; }

th { background: #f0f0f0; }
.hidden { display: none; }

/* Mobile responsive table */
@media (max-width: 600px) {
  table, thead, tbody, th, td, tr { display: block; }
  thead { display: none; }
  tr { margin-bottom: 12px; border: 1px solid black; padding: 8px; border-radius: 8px; }
  td { border: none; position: relative; padding-left: 50%; margin-bottom: 6px; }
  td:before {
    position: absolute;
    top: 8px;
    left: 10px;
    width: 45%;
    font-weight: bold;
    white-space: nowrap;
  }
  td:nth-of-type(1):before { content: "Date"; }
  td:nth-of-type(2):before { content: "Start"; }
  td:nth-of-type(3):before { content: "End"; }
  td:nth-of-type(4):before { content: "Drone"; }
  td:nth-of-type(5):before { content: "Location"; }
  td:nth-of-type(6):before { content: "LAANC"; }
  td:nth-of-type(7):before { content: "Minutes"; }
  td:nth-of-type(8):before { content: "Weather"; }
  td:nth-of-type(9):before { content: "Notes"; }
  td:nth-of-type(10):before { content: "Delete"; }
}
</style>
</head>

<body>

<h1>Drone Flight Log</h1>

<div class="card">
  <label>Pilot</label>
  <input value="Randy Neal" disabled>

  <label>Drone</label>
  <input id="drone">

  <label>Location</label>
  <input id="location">

  <label>LAANC Authorization # (if applicable)</label>
  <input id="laanc" placeholder="e.g. A2025-004821">

  <label>Purpose of Flight</label>
  <input id="purpose">

  <label>Day / Night</label>
  <select id="daynight">
    <option>Day</option>
    <option>Night</option>
  </select>

  <label>Visual Observer</label>
  <input id="observer">

  <label>Weather (select all that apply)</label>
  <div class="weather-container">
    <label class="weather-option"><input type="checkbox" value="Clear">Clear</label>
    <label class="weather-option"><input type="checkbox" value="Cloudy">Cloudy</label>
    <label class="weather-option"><input type="checkbox" value="Rain">Rain</label>
    <label class="weather-option"><input type="checkbox" value="Snow">Snow</label>
    <label class="weather-option"><input type="checkbox" value="Windy">Windy</label>
  </div>

  <label>Notes</label>
  <textarea id="notes"></textarea>

  <button class="start" onclick="startFlight()">START FLIGHT</button>
  <button class="stop" onclick="endFlight()">END FLIGHT</button>

  <div id="timer">00:00:00</div>
</div>

<div class="card">
  <h2>Stats</h2>
  <div class="stats">
    <div>Total Flights: <b id="totalFlights">0</b></div>
    <div>Total Minutes: <b id="totalMinutes">0</b></div>
  </div>
</div>

<div class="card">
  <button class="admin" onclick="toggleAdmin()">Admin Unlock / Lock</button>
</div>

<div class="card">
  <h2>Flight History</h2>
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Start</th>
        <th>End</th>
        <th>Drone</th>
        <th>Location</th>
        <th>LAANC</th>
        <th>Minutes</th>
        <th>Weather</th>
        <th>Notes</th>
        <th class="adminOnly hidden">Delete</th>
      </tr>
    </thead>
    <tbody id="log"></tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, deleteDoc, doc,
  onSnapshot, enableIndexedDbPersistence
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* Firebase config */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID"
};

const ADMIN_PIN = "1019";
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* Offline mode */
enableIndexedDbPersistence(db).catch(() => {});

let startTime = null, timerInterval = null, admin = false;

const formatTime = t =>
  new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

window.startFlight = () => {
  if (startTime) return;
  startTime = new Date();
  timerInterval = setInterval(() => {
    timer.innerText = new Date(new Date() - startTime)
      .toISOString().substring(11,19);
  }, 1000);
};

window.endFlight = async () => {
  if (!startTime) return;
  clearInterval(timerInterval);

  const endTime = new Date();
  const minutes = Math.round((endTime - startTime) / 60000);

  const weather = [...document.querySelectorAll('.weather-option input:checked')]
    .map(cb => cb.value);

  await addDoc(collection(db, "flights"), {
    pilot: "Randy Neal",
    date: startTime.toISOString(),
    startTime: startTime.toISOString(),
    endTime: endTime.toISOString(),
    drone: drone.value,
    location: location.value,
    laanc: laanc.value,
    purpose: purpose.value,
    daynight: daynight.value,
    observer: observer.value,
    weather,
    notes: notes.value,
    minutes
  });

  startTime = null;
  timer.innerText = "00:00:00";
  document.querySelectorAll('.weather-option input').forEach(cb => cb.checked = false);
};

window.toggleAdmin = () => {
  if (!admin && prompt("Enter Admin PIN") === ADMIN_PIN) {
    admin = true;
    document.querySelectorAll(".adminOnly").forEach(e => e.classList.remove("hidden"));
  } else {
    admin = false;
    document.querySelectorAll(".adminOnly").forEach(e => e.classList.add("hidden"));
  }
};

onSnapshot(collection(db, "flights"), snap => {
  log.innerHTML = "";
  let flights = 0, minutes = 0;

  snap.forEach(d => {
    const f = d.data();
    flights++; minutes += f.minutes;

    log.innerHTML += `
      <tr>
        <td>${new Date(f.date).toLocaleDateString()}</td>
        <td>${formatTime(f.startTime)}</td>
        <td>${formatTime(f.endTime)}</td>
        <td>${f.drone}</td>
        <td>${f.location}</td>
        <td>${f.laanc || ""}</td>
        <td>${f.minutes}</td>
        <td class="weather">${(f.weather || []).join(", ")}</td>
        <td class="notes">${f.notes || ""}</td>
        ${admin ? `<td><button onclick="deleteFlight('${d.id}')">❌</button></td>` : ""}
      </tr>`;
  });

  totalFlights.innerText = flights;
  totalMinutes.innerText = minutes;
});

window.deleteFlight = async id => {
  if (confirm("Delete flight?")) await deleteDoc(doc(db,"flights",id));
};
</script>

</body>
</html>
