<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drone Flight Log – Randy Neal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; background:#f4f6f8; padding:14px; color:black; }
.card { background:white; border:2px solid black; border-radius:12px; padding:16px; margin-bottom:14px; }
label { font-weight:bold; margin-top:10px; display:block; }
input, select, textarea { width:100%; padding:10px; font-size:16px; border:1px solid black; border-radius:6px; color:black; }
textarea { resize:vertical; }
button { width:100%; padding:14px; font-size:18px; margin-top:10px; border:none; border-radius:10px; color:white; }
.start { background:#28a745; }
.stop { background:#c82333; }
#timer { text-align:center; font-size:28px; font-weight:bold; margin-top:10px; }
table { width:100%; border-collapse:collapse; }
th,td { border:1px solid black; padding:8px; }
th { background:#eee; }
</style>
</head>

<body>

<h1>Drone Flight Log</h1>

<div class="card">
  <label>Pilot</label>
  <input value="Randy Neal" disabled>

  <label>Drone</label><input id="drone">
  <label>Location</label><input id="location">
  <label>LAANC</label><input id="laanc">
  <label>Purpose</label><input id="purpose">
  <label>Observer</label><input id="observer">
  <label>Weather</label><input id="weather">
  <label>Notes</label><textarea id="notes"></textarea>

  <button class="start" onclick="startFlight()">START FLIGHT</button>
  <button class="stop" onclick="endFlight()">END FLIGHT</button>

  <div id="timer">00:00:00</div>
</div>

<div class="card">
  <h2>Flight History</h2>
  <table>
    <thead>
      <tr>
        <th>Date</th><th>Minutes</th><th>Drone</th><th>Delete</th>
      </tr>
    </thead>
    <tbody id="log"></tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, Timestamp } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBT_rjRmkYzgq0PZo5fTPbIjnICD5kbbzE",
  authDomain: "flight-log-5f750.firebaseapp.com",
  projectId: "flight-log-5f750"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let timerInterval = null;
let elapsedSeconds = 0;
let flightStartDate = null;

function updateTimer() {
  elapsedSeconds++;
  const hrs = String(Math.floor(elapsedSeconds / 3600)).padStart(2,'0');
  const mins = String(Math.floor((elapsedSeconds % 3600)/60)).padStart(2,'0');
  const secs = String(elapsedSeconds % 60).padStart(2,'0');
  document.getElementById("timer").innerText = `${hrs}:${mins}:${secs}`;
}

window.startFlight = () => {
  if (timerInterval) return;

  elapsedSeconds = 0;
  flightStartDate = new Date();
  document.getElementById("timer").innerText = "00:00:00";

  timerInterval = setInterval(updateTimer, 1000);
};

window.endFlight = async () => {
  if (!timerInterval) return;

  clearInterval(timerInterval);
  timerInterval = null;

  const minutes = Math.max(1, Math.round(elapsedSeconds / 60));

  await addDoc(collection(db,"flights"), {
    date: Timestamp.fromDate(flightStartDate),
    minutes,
    drone: drone.value || ""
  });

  // HARD RESET
  elapsedSeconds = 0;
  flightStartDate = null;
  document.getElementById("timer").innerText = "00:00:00";
  ["drone","location","laanc","purpose","observer","weather","notes"].forEach(id => document.getElementById(id).value="");
};

window.deleteFlight = async id => {
  if(confirm("Delete flight?")) await deleteDoc(doc(db,"flights",id));
};

onSnapshot(collection(db,"flights"), snap => {
  log.innerHTML="";
  snap.forEach(d=>{
    const f=d.data();
    log.innerHTML += `
      <tr>
        <td>${f.date.toDate().toLocaleDateString()}</td>
        <td>${f.minutes}</td>
        <td>${f.drone}</td>
        <td><button onclick="deleteFlight('${d.id}')">❌</button></td>
      </tr>`;
  });
});
</script>

</body>
</html>
