<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drone Flight Log – Randy Neal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; background:#f4f6f8; padding:14px; color:black; }
h1,h2 { text-align:center; }
.card { background:white; border:2px solid black; border-radius:12px; padding:16px; margin-bottom:14px; }
label { font-weight:bold; margin-top:10px; display:block; }
input, select, textarea {
  width:100%; padding:10px; font-size:16px;
  border:1px solid black; border-radius:6px; color:black;
}
textarea { resize:vertical; }
button {
  width:100%; padding:14px; font-size:18px;
  margin-top:10px; border:none; border-radius:10px;
  color:white; cursor:pointer;
}
.start { background:#28a745; }
.stop { background:#c82333; }
.reset { background:#6c757d; }
#timer { text-align:center; font-size:28px; font-weight:bold; margin-top:10px; }

table { width:100%; border-collapse:collapse; margin-top:10px; }
th, td { border:1px solid black; padding:8px; vertical-align:top; }
th { background:#eee; }
</style>
</head>

<body>

<h1>Drone Flight Log</h1>

<div class="card">
  <label>Pilot</label>
  <input value="Randy Neal" disabled>

  <label>Drone</label>
  <input id="drone">

  <label>Location</label>
  <input id="flightLocation">

  <label>LAANC Authorization</label>
  <input id="laanc">

  <label>Purpose of Flight</label>
  <input id="purpose">

  <label>Day / Night</label>
  <select id="daynight">
    <option>Day</option>
    <option>Night</option>
  </select>

  <label>Visual Observer</label>
  <input id="observer">

  <label>Weather</label>
  <input id="weather">

  <label>Notes</label>
  <textarea id="notes"></textarea>

  <button class="start" onclick="startFlight()">START FLIGHT</button>
  <button class="stop" onclick="endFlight()">END FLIGHT</button>
  <button class="reset" onclick="resetFlight()">RESET FLIGHT</button>

  <div id="timer">00:00:00</div>
</div>

<div class="card">
  <h2>Flight History</h2>
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Duration</th>
        <th>Drone</th>
        <th>Location</th>
        <th>LAANC</th>
        <th>Day/Night</th>
        <th>Observer</th>
        <th>Weather</th>
        <th>Notes</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody id="log"></tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, deleteDoc, doc,
  onSnapshot, Timestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBT_rjRmkYzgq0PZo5fTPbIjnICD5kbbzE",
  authDomain: "flight-log-5f750.firebaseapp.com",
  projectId: "flight-log-5f750"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ===== TIMER (STABLE) ===== */
let timerInterval = null;
let elapsedSeconds = 0;
let flightStartDate = null;

function updateTimer() {
  elapsedSeconds++;
  const h = String(Math.floor(elapsedSeconds / 3600)).padStart(2,'0');
  const m = String(Math.floor((elapsedSeconds % 3600)/60)).padStart(2,'0');
  const s = String(elapsedSeconds % 60).padStart(2,'0');
  timer.innerText = `${h}:${m}:${s}`;
}

function formatDuration(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2,'0');
  const s = String(sec % 60).padStart(2,'0');
  return `${m}:${s}`;
}

window.startFlight = () => {
  if (timerInterval) return;
  elapsedSeconds = 0;
  flightStartDate = new Date();
  timer.innerText = "00:00:00";
  timerInterval = setInterval(updateTimer, 1000);
};

window.resetFlight = () => {
  clearInterval(timerInterval);
  timerInterval = null;
  elapsedSeconds = 0;
  flightStartDate = null;
  timer.innerText = "00:00:00";
};

window.endFlight = async () => {
  if (!timerInterval) return;

  clearInterval(timerInterval);
  timerInterval = null;

  const saveDate = flightStartDate;
  const saveDuration = formatDuration(elapsedSeconds);

  await addDoc(collection(db,"flights"), {
    date: Timestamp.fromDate(saveDate),
    duration: saveDuration,
    drone: drone.value || "",
    location: flightLocation.value || "",
    laanc: laanc.value || "",
    purpose: purpose.value || "",
    daynight: daynight.value || "",
    observer: observer.value || "",
    weather: weather.value || "",
    notes: notes.value || ""
  });

  elapsedSeconds = 0;
  flightStartDate = null;
  timer.innerText = "00:00:00";

  ["drone","flightLocation","laanc","purpose","observer","weather","notes"]
    .forEach(id => document.getElementById(id).value = "");
  daynight.value = "Day";
};

window.deleteFlight = async id => {
  if(confirm("Delete this flight?")) {
    await deleteDoc(doc(db,"flights",id));
  }
};

onSnapshot(collection(db,"flights"), snap => {
  log.innerHTML="";
  snap.forEach(d=>{
    const f = d.data();
    log.innerHTML += `
      <tr>
        <td>${f.date.toDate().toLocaleDateString()}</td>
        <td>${f.duration}</td>
        <td>${f.drone}</td>
        <td>${f.location}</td>
        <td>${f.laanc}</td>
        <td>${f.daynight}</td>
        <td>${f.observer}</td>
        <td>${f.weather}</td>
        <td>${f.notes}</td>
        <td><button onclick="deleteFlight('${d.id}')">❌</button></td>
      </tr>
    `;
  });
});
</script>

</body>
</html>
